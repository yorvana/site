<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% capture page_meta_title %}{% if page.title and page.title != site.title %}{{ page.title }} | {% endif %}{{ site.title }}{% endcapture %}
<title>{{ page_meta_title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#012459">

<meta property="og:type" content="{{ page.og_type | default: "website" }}">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ page_meta_title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ '/assets/img/og-card.png' | absolute_url }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_meta_title }}">
<meta name="twitter:description" content="{{ page.description | default: site.description }}">
<meta name="twitter:image" content="{{ '/assets/img/og-card.png' | absolute_url }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">

<link rel="icon" href="{{ '/assets/img/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
{% if page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "SoftwareApplication",
  "name": "Yorvana",
  "applicationCategory": "UtilityApplication",
  "operatingSystem": "Android",
  "description": {{ site.description | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "image": {{ '/assets/img/og-card.png' | absolute_url | jsonify }},
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>
{% endif %}
